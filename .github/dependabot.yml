version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Keep security updates enabled without opening routine version-update PRs.
    open-pull-requests-limit: 0
    groups:
      prisma:
        patterns:
          - prisma
          - "@prisma/client"
    ignore:
      # Prisma major upgrades change both the CLI configuration and client API.
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      # ESLint 10 currently crashes in eslint-config-next's React plugin.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
